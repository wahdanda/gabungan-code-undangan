<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petunjuk Arah</title>
    <link href="tailwind_code.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <main class="min-h-screen flex items-center justify-center p-6">
        <section class="w-full max-w-3xl rounded-[32px] bg-white p-8 shadow-xl ring-1 ring-slate-200">
            <div class="text-center space-y-4">
                <img src="https://storage.googleapis.com/stateless-swalapatra-com/2023/02/7fd633a3-leaves-gold-divider.png" alt="divider" class="mx-auto h-12" />
                <h1 class="text-3xl font-semibold text-slate-900">Acara Resepsi</h1>
                <p class="text-slate-600">Silakan gunakan tombol di bawah untuk membuka petunjuk arah lokasi acara.</p>
            </div>

            <div class="mt-10 grid gap-6 lg:grid-cols-3">
                <div class="rounded-3xl border border-slate-200 bg-slate-50 p-6 text-center">
                    <p class="text-sm uppercase tracking-[0.25em] text-slate-500">Hari</p>
                    <p class="mt-3 text-4xl font-semibold text-slate-900">Jumat</p>
                </div>
                <div class="rounded-3xl border border-slate-200 bg-slate-50 p-6 text-center">
                    <p class="text-sm uppercase tracking-[0.25em] text-slate-500">Tanggal</p>
                    <p class="mt-3 text-4xl font-semibold text-slate-900">7 November 2025</p>
                </div>
                <div class="rounded-3xl border border-slate-200 bg-slate-50 p-6 text-center">
                    <p class="text-sm uppercase tracking-[0.25em] text-slate-500">Waktu</p>
                    <p class="mt-3 text-4xl font-semibold text-slate-900">11:00 - 15:00 WITA</p>
                </div>
            </div>

            <div class="mt-8 rounded-3xl border border-slate-200 bg-slate-50 p-6">
                <div class="flex items-center gap-3 text-slate-900">
                    <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-sky-100 text-sky-700">
                        📍
                    </span>
                    <div>
                        <p class="text-sm text-slate-500">Lokasi</p>
                        <p class="font-semibold">Taman Prakerti Buana</p>
                    </div>
                </div>
            </div>

            <div class="mt-8 text-center">
                <a href="https://maps.app.goo.gl/NjerRCBgoVrGesUE9" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center rounded-full bg-sky-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-sky-700">
                    Petunjuk Arah
                </a>
            </div>
        </section>
    </main>
</body>
</html>
