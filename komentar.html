<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#f4ebd9] flex justify-center items-center min-h-screen m-0 p-5 font-sans">

<div class="bg-[#fcf8f2] w-full max-w-[450px] p-[30px] rounded-[20px] shadow-[0_10px_25px_rgba(0,0,0,0.05)] box-border">
    <div class="text-[16px] font-semibold text-[#8a7350] mt-[25px] mb-[15px] flex items-center gap-[6px]">
        <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="m23 11.5l-3.05-1.13c-.26-1.15-.91-1.81-.91-1.81a4.19 4.19 0 0 0-5.93 0l-1.48 1.48L5 3c-1 4 0 8 2.45 11.22L2 19.5s8.89 2 14.07-2.05c2.76-2.16 3.38-3.42 3.77-4.75zm-5.29.22c-.39.39-1.03.39-1.42 0a.996.996 0 0 1 0-1.41c.39-.39 1.03-.39 1.42 0s.39 1.02 0 1.41" />
        </svg>
        <span id="totalUcapanText">0 Wishes (Wishes)</span>
    </div>
    
    <hr class="border-gray-200 mb-4">
    
    <div class="mb-[15px]">
        <input type="text" id="nama" placeholder="Nama Anda" required class="w-full p-[12px] border border-[#e0d0b8] rounded-[8px] bg-white text-[14px] box-border outline-none focus:border-[#cbb280]">
    </div>
    <div class="mb-[15px]">
        <input type="text" id="ucapan" placeholder="Ucapan Dan Doa Restu" required class="w-full p-[12px] border border-[#e0d0b8] rounded-[8px] bg-white text-[14px] box-border outline-none focus:border-[#cbb280]">
    </div>
    <div class="mb-4 w-full">
        <select id="konfir" name="konfirmasi" required class="w-full p-[12px] border border-[#e0d0b8] rounded-[8px] bg-white text-[14px] text-[#333] box-border outline-none focus:border-[#cbb280]">
            <option value="" disabled selected>Konfirmasi Kehadiran (attendance)</option>
            <option value="Hadir (accept with pleasure)">Hadir (accept with pleasure)</option>
            <option value="Tidak hadir (decline with regret)">Tidak hadir (decline with regret)</option>
        </select>
    </div>
    
    <button id="btnKirim" class="w-full p-[12px] bg-[#d4b982] hover:bg-[#c1a46d] text-white border-none rounded-[25px] text-[16px] font-bold cursor-pointer transition-colors duration-300">Kirimkan Ucapan</button>
    
    <hr class="border-0 border-t border-gray-200 my-[25px]">
    
    <div class="max-h-[400px] overflow-y-auto pr-[5px]" id="daftarUcapan"></div>
    
    <div class="flex justify-center items-center gap-[15px] mt-[20px] text-[13px] text-[#8a7350]">
        <button id="btnPrev" class="px-[12px] py-[5px] border border-[#e0d0b8] bg-white text-[#8a7350] rounded-[6px] text-[13px] font-normal w-auto cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed" disabled>&larr; Previous</button>
        <span id="pageInfo">1</span>
        <button id="btnNext" class="px-[12px] py-[5px] border border-[#e0d0b8] bg-white text-[#8a7350] rounded-[6px] text-[13px] font-normal w-auto cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">Next &rarr;</button>
    </div>
</div>

</body>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, limit, startAfter, getDocs, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB0yXNsKkBFkbhOamAPbHcOc_Glx9Gmh-8",
        authDomain: "ucapan-pernikahan-773bc.firebaseapp.com",
        projectId: "ucapan-pernikahan-773bc",
        storageBucket: "ucapan-pernikahan-773bc.firebasestorage.app",
        messagingSenderId: "186882972054",
        appId: "1:186882972054:web:1327434c1706b7030025b7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ucapanCollection = collection(db, "ucapan_pernikahan");

    const namaInput = document.getElementById('nama');
    const ucapanInput = document.getElementById('ucapan');
    const konfirInpu = document.getElementById('konfir');
    const btnKirim = document.getElementById('btnKirim');
    const daftarUcapan = document.getElementById('daftarUcapan');
    const totalUcapanText = document.getElementById('totalUcapanText');
    
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const pageInfo = document.getElementById('pageInfo');

    const itemPerPage = 4;
    let pageHistory = [];  
    let currentPageIndex = 0;

    function formatWaktu(timestamp) {
        if (!timestamp) return "baru saja";
        
        const dateKirim = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        const sekarang = new Date();
        const selisihDetik = Math.floor((sekarang - dateKirim) / 1000);

        if (selisihDetik < 60) {
            return "baru saja";
        }

        const selisihMenit = Math.floor(selisihDetik / 60);
        if (selisihMenit < 60) {
            return `${selisihMenit} menit lalu`;
        }

        const selisihJam = Math.floor(selisihMenit / 60);
        if (selisihJam < 24) {
            return `${selisihJam} jam lalu`;
        }

        const selisihHari = Math.floor(selisihJam / 24);
        if (selisihHari < 30) {
            return `${selisihHari} hari lalu`;
        }

        const selisihBulan = Math.floor(selisihHari / 30);
        return `${selisihBulan} bulan lalu`;
    }

    async function updateCounter() {
        try {
            const snapshot = await getCountFromServer(ucapanCollection);
            const totalCount = snapshot.data().count;
            totalUcapanText.innerText = `${totalCount} Wishes (Wishes)`;
        } catch (error) {
            console.error("Gagal menghitung jumlah ucapan: ", error);
        }
    }

    async function muatHalaman() {
        let q = query(ucapanCollection, orderBy("timestamp", "desc"), limit(itemPerPage));
        
        if (currentPageIndex > 0 && pageHistory[currentPageIndex - 1]) {
            q = query(ucapanCollection, orderBy("timestamp", "desc"), startAfter(pageHistory[currentPageIndex - 1]), limit(itemPerPage));
        }

        try {
            const snapshot = await getDocs(q);
            daftarUcapan.innerHTML = "";

            if (snapshot.empty) {
                daftarUcapan.innerHTML = "<p class='text-center text-[13px] text-gray-400'>Belum ada ucapan di halaman ini.</p>";
                btnNext.disabled = true;
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                
                const isHadir = data.konfir && data.konfir.includes("Hadir");
                // Migrasi class warna badge dinamis ke Tailwind
                const badgeClass = isHadir ? "bg-[#8a7655]" : "bg-[#a38260]";

                const card = document.createElement('div');
                // Migrasi style card ke Tailwind Utility
                card.className = 'flex items-start mb-5 border-bottom border-[#f0e6d2] pb-[15px] last:border-b-0 animate-[fadeIn_0.5s_ease]';
                card.innerHTML = `
                    <div class="w-10 h-10 bg-[#e8dcbf] rounded-full flex justify-center items-center text-[#8a7350] text-[18px] mr-3 shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <path fill="currentColor" d="M12 3c5.5 0 10 3.58 10 8s-4.5 8-10 8c-1.24 0-2.43-.18-3.53-.5C5.55 21 2 21 2 21c2.33-2.33 2.7-3.9 2.75-4.5C3.05 15.07 2 13.13 2 11c0-4.42 4.5-8 10-8" />
                        </svg>
                    </div>
                    <div class="grow">
                        <div class="font-bold text-[14px] text-[#4a3f31] flex items-center flex-wrap gap-2">
                            ${escapeHTML(data.nama)} 
                            <span class="text-[11px] font-normal px-2 py-[2px] rounded-[4px] text-white inline-flex items-center gap-1 ${badgeClass}">✓ ${escapeHTML(data.konfir || 'Hadir')}</span>
                        </div>
                        <div class="text-[11px] text-[#998467] flex items-center gap-1 mt-[2px] mb-1.5">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                                <path d="M0 0h24v24H0z" fill="none" />
                                <path fill="currentColor" d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,20a9,9,0,1,1,9-9A9,9,0,0,1,12,21Z" />
                                <rect width="2" height="7" x="11" y="6" fill="currentColor" rx="1">
                                    <animateTransform attributeName="transform" dur="9s" repeatCount="indefinite" type="rotate" values="0 12 12;360 12 12" />
                                </rect>
                                <rect width="2" height="9" x="11" y="11" fill="currentColor" rx="1">
                                    <animateTransform attributeName="transform" dur="0.75s" repeatCount="indefinite" type="rotate" values="0 12 12;360 12 12" />
                                </rect>
                            </svg>
                            ${formatWaktu(data.timestamp)}
                        </div>
                        <div class="text-[13px] text-gray-600 break-all leading-[1.4]">${escapeHTML(data.ucapan)}</div>
                    </div>
                `;
                daftarUcapan.appendChild(card);
            });

            pageHistory[currentPageIndex] = snapshot.docs[snapshot.docs.length - 1];
            pageInfo.innerText = currentPageIndex + 1;
            btnPrev.disabled = (currentPageIndex === 0);
            
            const qNextCheck = query(ucapanCollection, orderBy("timestamp", "desc"), startAfter(pageHistory[currentPageIndex]), limit(1));
            const nextSnapshot = await getDocs(qNextCheck);
            btnNext.disabled = nextSnapshot.empty;

        } catch (error) {
            console.error("Gagal memuat data: ", error);
        }
    }

    btnNext.addEventListener('click', () => {
        currentPageIndex++;
        muatHalaman();
    });

    btnPrev.addEventListener('click', () => {
        if (currentPageIndex > 0) {
            currentPageIndex--;
            muatHalaman();
        }
    });

    btnKirim.addEventListener('click', async () => {
        const nama = namaInput.value.trim();
        const ucapan = ucapanInput.value.trim();
        const konfir = konfirInpu.value.trim();

        if(nama === "" || ucapan === "") {
            alert("Silakan isi nama dan ucapan terlebih dahulu!");
            return;
        }

        if(konfir == ""){
            alert("Silakan masukkan konfirmasi kehadiran");
            return;
        }

        try {
            await addDoc(ucapanCollection, {
                nama: nama,
                ucapan: ucapan,
                konfir: konfir,
                timestamp: new Date()
            });

            namaInput.value = "";
            ucapanInput.value = "";
            konfirInpu.value = "";
            
            currentPageIndex = 0;
            pageHistory = [];
            await updateCounter();
            muatHalaman();
        } catch (error) {
            console.error("Gagal mengirim ucapan: ", error);
        }
    });

    updateCounter();
    muatHalaman();

    function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>
</html>
