     SADARIN PREMIUM CONTACT FORM

        <section class="contact-section"  data-aos="fade-up" data-aos-delay="600">
            <div class="contact-card">
                <!-- HEADER -->
                <div class="contact-header">
                    <h2>Kirim Pesan</h2>
                    <p>
                        Ada pertanyaan atau ingin bekerja sama?
                        Tim Sadarin siap membantu Anda.
                    </p>
                </div>
                <!-- FORM -->
                <form id="whatsappForm">
                    <!-- NAME -->
                    <div class="form-group">
                        <label>Nama Lengkap</label>
                        <input
                        type="text"
                        id="name"
                        placeholder="Cth: Michael Julio"
                        required>
                    </div>
                    <!-- EMAIL -->
                    <div class="form-group">
                        <label>Alamat Email</label>
                        <input
                        type="email"
                        id="email"
                        placeholder="anda@email.com"
                        required>
                    </div>
                    <!-- SUBJECT -->
                    <div class="form-group">
                        <label>Subjek</label>
                        <div class="select-wrapper">
                            <select id="subject" name="subjek" required>
                                <option value="pilih subjek">
                                    Pilih Subjek
                                </option>
                                <option value="Tanya Umum">
                                    Tanya Umum
                                </option>
                                <option value="Kerja Sama">
                                    Kerja Sama
                                </option>
                                <option value="Kemitraan">
                                    Kemitraan
                                </option>
                            </select>
                            <!-- ICON -->
                            <div class="select-icon">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                width="22"
                                height="22"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <!-- MESSAGE -->
                    <div class="form-group">
                        <label>Pesan Anda</label>
                        <textarea
                        id="message"
                        placeholder="Tuliskan pesan Anda di sini..."
                        required></textarea>
                    </div>
                    <!-- BUTTON -->
                    <button
                    type="submit"
                    class="send-btn"
                    id="sendBtn">
                        <!-- TEXT -->
                        <span class="btn-text">
                            Kirim Pesan Sekarang
                        </span>
                        <!-- CHECK -->
                        <div class="btn-check">
                            <svg xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"
                            stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                    </button>
                </form>

    <script src="./js/app.js"></script>
    <script>
        // Logika lokal untuk form kontak
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Animasi loading ala Eco Nusantara
            Swal.fire({
                title: 'Mengirim Pesan...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            setTimeout(() => {
                Swal.fire({
                    icon: 'success',
                    title: 'Pesan Terkirim!',
                    text: 'Terima kasih telah menghubungi kami. Tim kami akan membalas via email secepatnya.',
                    confirmButtonColor: '#166534'
                });
                this.reset();
            }, 1500);
        });

        // Mengisi data otomatis jika user login
        window.addEventListener('load', () => {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if(user) {
                document.getElementById('contact-name').value = user.name || "";
                document.getElementById('contact-email').value = user.email || "";
            }
        });
    </script>
