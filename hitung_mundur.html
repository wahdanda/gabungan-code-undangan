<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Pernikahan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        .font-signature {
            font-family: 'Great Vibes', cursive;
        }
    </style>
</head>
<body class="font-sans bg-[#f4ebd9] text-[#4a4a4a] flex justify-center items-center min-h-screen m-0">

    <div class="text-center max-w-2xl px-6 py-4">
        
        <h1 class="font-signature text-5xl md:text-6xl mb-4 text-[#2c2c2c] tracking-wide">
            Menuju Hari Bahagia
        </h1>
        
        <p class="text-sm md:text-base leading-relaxed mb-8 text-[#6b6b6b] font-light max-w-md mx-auto">
            Siang dan malam berganti begitu cepat, di antara saat-saat mendebarkan yang belum pernah kami rasakan sebelumnya. Kami nantikan kehadiran para keluarga dan sahabat, untuk menjadi saksi ikrar janji suci kami di hari yang bahagia.
        </p>

        <div class="flex justify-center gap-3 md:gap-4">
            
            <div class="bg-[#9c927d] text-white w-20 md:w-24 py-4 rounded-2xl shadow-sm">
                <span class="text-3xl md:text-4xl font-semibold block mb-1" id="hari">00</span>
                <span class="text-xs font-light tracking-wide opacity-90">Hari</span>
            </div>
            
            <div class="bg-[#9c927d] text-white w-20 md:w-24 py-4 rounded-2xl shadow-sm">
                <span class="text-3xl md:text-4xl font-semibold block mb-1" id="jam">00</span>
                <span class="text-xs font-light tracking-wide opacity-90">Jam</span>
            </div>
            
            <div class="bg-[#9c927d] text-white w-20 md:w-24 py-4 rounded-2xl shadow-sm">
                <span class="text-3xl md:text-4xl font-semibold block mb-1" id="menit">00</span>
                <span class="text-xs font-light tracking-wide opacity-90">Menit</span>
            </div>
            
            <div class="bg-[#9c927d] text-white w-20 md:w-24 py-4 rounded-2xl shadow-sm">
                <span class="text-3xl md:text-4xl font-semibold block mb-1" id="detik">00</span>
                <span class="text-xs font-light tracking-wide opacity-90">Detik</span>
            </div>
            
        </div>
    </div>

<script>
    // 1. ATUR TANGGAL PERNIKAHAN DI SINI (Format: Bulan Tanggal, Tahun Jam:Menit:Detik)
    const tanggalAcara = new Date("December 31, 2026 09:00:00").getTime();

    // 2. KODE HITUNG MUNDUR (Berjalan otomatis setiap 1 detik)
    const hitungMundur = setInterval(function() {

        // Ambil waktu saat ini
        const sekarang = new Date().getTime();

        // Cari selisih antara waktu acara dan waktu sekarang
        const selisih = tanggalAcara - sekarang;

        // Rumus matematika untuk mendapatkan Hari, Jam, Menit, dan Detik
        const hari = Math.floor(selisih / (1000 * 60 * 60 * 24));
        const jam = Math.floor((selisih % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const menit = Math.floor((selisih % (1000 * 60 * 60)) / (1000 * 60));
        const detik = Math.floor((selisih % (1000 * 60)) / 1000);

        // Tambahkan angka 0 di depan jika angka di bawah 10
        document.getElementById("hari").innerHTML = hari < 10 ? "0" + hari : hari;
        document.getElementById("jam").innerHTML = jam < 10 ? "0" + jam : jam;
        document.getElementById("menit").innerHTML = menit < 10 ? "0" + menit : menit;
        document.getElementById("detik").innerHTML = detik < 10 ? "0" + detik : detik;

        // Jika hitung mundur selesai / waktu sudah lewat
        if (selisih < 0) {
            clearInterval(hitungMundur);
            document.getElementById("hari").innerHTML = "00";
            document.getElementById("jam").innerHTML = "00";
            document.getElementById("menit").innerHTML = "00";
            document.getElementById("detik").innerHTML = "00";
        }
    }, 1000);
</script>

</body>
</html>
