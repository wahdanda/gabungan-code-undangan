                    <div class="-mt-5 flex justify-end">
                        <button type="button" onclick="copyText('-------', this)" class="inline-flex items-center justify-center rounded-full bg-gray-500 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-yellow-700 focus:outline-none focus:ring-2 focus:ring-yellow-500">

                            </svg>

                        </button>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <script>
        function copyText(value, button) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(value).catch(function() {
                    fallbackCopy(value);
                });
            } else {
                fallbackCopy(value);
            }

            const originalText = button.textContent;
            button.textContent = 'Berhasil disalin';
            button.disabled = true;
            setTimeout(function() {
                button.textContent = originalText;
                button.disabled = false;
            }, 1200);
        }

        function fallbackCopy(value) {
            const textarea = document.createElement('textarea');
            textarea.value = value;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }
    </script>
</body>
</html>
